<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Format Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <div class="bg-blue-600 px-6 py-4 border-b border-blue-700">
            <h1 class="text-xl sm:text-2xl font-semibold text-white flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
                Name Format Converter
            </h1>
            <p class="text-blue-100 text-sm mt-1">Convert "Last, First" to "First Last" for easy pasting.</p>
        </div>

        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Input Section -->
                <div class="flex flex-col h-full">
                    <div class="flex justify-between items-center mb-2">
                        <label for="inputNames" class="text-sm font-medium text-gray-700">Input Names</label>
                        <button onclick="clearInput()" class="text-xs text-gray-500 hover:text-red-500 transition-colors">Clear</button>
                    </div>
                    <textarea id="inputNames" 
                        class="w-full flex-grow min-h-[250px] p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y text-sm leading-relaxed" 
                        placeholder="Paste names here...&#10;Doe, John&#10;Smith, Jane&#10;Perez, Jayleen"></textarea>
                </div>

                <!-- Output Section -->
                <div class="flex flex-col h-full">
                    <div class="flex justify-between items-center mb-2">
                        <label for="outputNames" class="text-sm font-medium text-gray-700">Converted Names</label>
                    </div>
                    <textarea id="outputNames" readonly
                        class="w-full flex-grow min-h-[250px] p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y text-sm leading-relaxed text-gray-800" 
                        placeholder="Results will appear here..."></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <button onclick="convertNames()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                    </svg>
                    Convert Format
                </button>
                <button onclick="copyToClipboard()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                        <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                    </svg>
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 flex items-center gap-2 z-50 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        <span id="toastMessage">Copied to clipboard!</span>
    </div>

    <script>
        function convertNames() {
            const inputArea = document.getElementById('inputNames');
            const outputArea = document.getElementById('outputNames');
            const lines = inputArea.value.split('\n');
            
            const convertedLines = lines.map(line => {
                // Ignore empty lines
                if (!line.trim()) return '';
                
                // Check if line contains a comma
                if (line.includes(',')) {
                    // Split by the first comma in case there are multiple
                    const parts = line.split(',');
                    const lastName = parts[0].trim();
                    // Rejoin the rest in case the first name had a comma (rare, but safe)
                    const firstName = parts.slice(1).join(',').trim();
                    
                    return `${firstName} ${lastName}`;
                }
                
                // If no comma is found, just return the original trimmed line
                return line.trim();
            });

            // Join the lines back together and set the output
            outputArea.value = convertedLines.join('\n');
        }

        function clearInput() {
            document.getElementById('inputNames').value = '';
            document.getElementById('outputNames').value = '';
            document.getElementById('inputNames').focus();
        }

        function copyToClipboard() {
            const outputArea = document.getElementById('outputNames');
            
            if (!outputArea.value.trim()) {
                showToast('Nothing to copy!', false);
                return;
            }

            // Select the text field
            outputArea.select();
            outputArea.setSelectionRange(0, 99999); // For mobile devices

            try {
                // Copy the text inside the text field
                document.execCommand('copy');
                // Deselect the text
                window.getSelection().removeAllRanges();
                showToast('Copied to clipboard!', true);
            } catch (err) {
                showToast('Failed to copy text.', false);
            }
        }

        let toastTimeout;
        function showToast(message, isSuccess) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            // Show toast
            toast.classList.remove('translate-y-10', 'opacity-0');
            
            // Clear existing timeout if multiple clicks happen quickly
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }
            
            // Hide toast after 2.5 seconds
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Seating Chart - Passaic</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            /* Colors */
            --floor-color: #dcb382;
            --floor-grain: #cd9f6d;
            --line-basketball: #1a1a1a; 
            --line-baseball: #1e40af;   
            --line-center: #16a34a;     
            --line-circle: #fbbf24;     
            --line-volleyball: #dc2626; 
            --seat-color: #3b82f6;
            --seat-hover: #2563eb;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #333;
        }

        #court-container {
            position: relative; width: 100vw; height: 100vh;
            background-color: var(--floor-color);
            background-image: repeating-linear-gradient(90deg, 
                transparent 0, transparent 20px, 
                rgba(0,0,0,0.03) 20px, rgba(0,0,0,0.03) 40px),
                linear-gradient(0deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 60px;
            overflow: hidden; background-position: center; background-repeat: no-repeat;
        }

        .wall-padding {
            position: absolute; width: 100%; height: 4%;
            background-color: #1e3a8a; z-index: 1; border-bottom: 2px solid #172554;
        }
        .wall-top { top: 0; }
        .wall-bottom { bottom: 0; border-top: 2px solid #172554; border-bottom: none; }

        .court-lines {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 95%; height: 90%; pointer-events: none; z-index: 2; transition: opacity 0.3s;
        }

        .watermark {
            position: absolute; bottom: 5%; right: 3%; font-size: 6rem; font-weight: 900;
            color: rgba(255, 255, 255, 0.15); pointer-events: none; user-select: none;
            z-index: 1; text-transform: uppercase; transform: rotate(-5deg);
        }

        #controls {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column;
            gap: 10px; max-height: 90vh; overflow-y: auto; width: 260px;
        }
        
        .controls-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        
        button {
            padding: 8px 12px; color: white; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 12px; flex: 1;
        }
        button:active { transform: scale(0.98); }
        .btn-add { background-color: #22c55e; }
        .btn-action { background-color: #3b82f6; }
        .btn-print { background-color: #64748b; }
        .btn-sound { background-color: #8b5cf6; width: 100%; }
        .btn-sound.muted { background-color: #9ca3af; }
        
        #show-menu-btn {
            position: absolute; top: 20px; left: 20px; z-index: 999;
            background-color: #3b82f6; display: none; width: auto;
        }
        
        .hint { font-size: 11px; color: #666; font-style: italic; margin-top: 3px; }

        .sheet-input-group {
            display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #ccc; padding-top: 10px;
        }
        .sheet-input-group input[type="text"], .sheet-input-group select {
            padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; width: 100%; box-sizing: border-box;
        }

        .seat {
            position: absolute; width: 75px; height: 95px; background: white;
            border: 3px solid var(--seat-color); border-radius: 8px;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            padding: 5px; cursor: grab; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 10; user-select: none; overflow: hidden;
        }
        .seat:active { cursor: grabbing; transform: scale(1.05); z-index: 100; }
        
        .student-img {
            width: 55px; height: 55px; border-radius: 50%; object-fit: cover;
            margin-bottom: 5px; background-color: #e5e7eb; pointer-events: none;
        }
        .seat input.name-input {
            width: 100%; border: none; background: transparent; text-align: center;
            font-weight: bold; font-size: 11px; color: #333; pointer-events: auto; margin-top: auto;
        }

        #fileInput, #bgInput, #excelUpload { display: none; }

        @media print {
            @page { size: landscape; margin: 0; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #controls, #show-menu-btn { display: none !important; }
            .seat { border: 2px solid #000; box-shadow: none; }
            #court-container { background-color: var(--floor-color) !important; }
        }
        
        .logo-text { font-family: 'Times New Roman', serif; font-weight: bold; font-size: 24px; fill: #1e3a8a; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="court-container">
        <div class="wall-padding wall-top"></div>
        <div class="wall-padding wall-bottom"></div>

        <svg id="court-lines" class="court-lines" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
            <polygon points="500,50 900,300 500,550 100,300" fill="none" stroke="var(--line-baseball)" stroke-width="3" opacity="0.8"/>
            <line x1="250" y1="50" x2="250" y2="550" stroke="var(--line-volleyball)" stroke-width="3" />
            <line x1="750" y1="50" x2="750" y2="550" stroke="var(--line-volleyball)" stroke-width="3" />
            <circle cx="500" cy="300" r="235" fill="none" stroke="var(--line-circle)" stroke-width="4" />
            <line x1="500" y1="50" x2="500" y2="550" stroke="var(--line-center)" stroke-width="4" />
            <rect x="50" y="50" width="900" height="500" fill="none" stroke="var(--line-basketball)" stroke-width="4"/>
            <rect x="50" y="190" width="230" height="220" fill="none" stroke="var(--line-basketball)" stroke-width="4"/>
            <path d="M 280 190 A 110 110 0 0 1 280 410" fill="none" stroke="var(--line-basketball)" stroke-width="4"/> 
            <path d="M 280 410 A 110 110 0 0 1 280 190" fill="none" stroke="var(--line-basketball)" stroke-width="4" stroke-dasharray="10,10"/> 
            <rect x="720" y="190" width="230" height="220" fill="none" stroke="var(--line-basketball)" stroke-width="4"/>
            <path d="M 720 190 A 110 110 0 0 0 720 410" fill="none" stroke="var(--line-basketball)" stroke-width="4"/>
            <path d="M 720 410 A 110 110 0 0 0 720 190" fill="none" stroke="var(--line-basketball)" stroke-width="4" stroke-dasharray="10,10"/>

            <g transform="translate(500, 300)">
                <circle r="75" fill="none" stroke="#1e3a8a" stroke-width="4"/> 
                <circle r="65" fill="none" stroke="#1e3a8a" stroke-width="2"/>
                <path id="textCurveTop" d="M -60,10 A 60,60 0 0,1 60,10" fill="none" />
                <path id="textCurveBottom" d="M -60,-10 A 60,60 0 0,0 60,-10" fill="none" />
                <text class="logo-text" font-size="14" text-anchor="middle"><textPath href="#textCurveTop" startOffset="50%">PASSAIC PUBLIC</textPath></text>
                <text class="logo-text" font-size="14" text-anchor="middle" dominant-baseline="hanging"><textPath href="#textCurveBottom" startOffset="50%">SCHOOLS</textPath></text>
                <path d="M -5,20 L 5,20 L 5,-5 Q 15,-15 25,-5 Q 35,-20 15,-30 Q 0,-45 -15,-30 Q -35,-20 -25,-5 Q -15,-15 -5,-5 Z" fill="#1e3a8a"/>
                <circle cx="0" cy="-35" r="5" fill="#1e3a8a"/> 
                <path d="M -20,25 L 20,25 L 25,35 L -25,35 Z" fill="#1e3a8a"/>
            </g>
        </svg>

        <div class="watermark">Tiu</div>
        <button id="show-menu-btn" onclick="toggleMenu()">☰ Menu</button>

        <div id="controls">
            <div class="controls-header">
                <span style="font-weight:bold; color:#333;">Controls</span>
                <button style="background:transparent; color:#ef4444; padding:0; flex:0;" onclick="toggleMenu()">✖</button>
            </div>

            <div class="sheet-input-group">
                <span style="font-weight:bold; font-size: 13px; color:#333;">Load Multi-Tab Roster</span>
                <input type="text" id="sheetUrlInput" placeholder="Paste link (pubhtml or edit)...">
                
                <div class="btn-group">
                    <button class="btn-add" id="fetchBtn" onclick="fetchGoogleSheet()">Fetch Link</button>
                    <button class="btn-action" style="background-color:#0ea5e9;" onclick="document.getElementById('excelUpload').click()">Upload .xlsx</button>
                    <input type="file" id="excelUpload" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
                </div>
                
                <select id="classSelect" style="display: none; margin-top: 5px;" onchange="renderSelectedClass()"></select>
                <div class="hint">Tabs will appear here once loaded.</div>
            </div>

            <div class="btn-group" style="margin-top: 10px;">
                <button class="btn-add" onclick="addSeat()">+ 1 Student</button>
                <button class="btn-action" onclick="saveLayout()">Save Setup</button>
            </div>
            
            <div class="btn-group">
                <button class="btn-action" onclick="document.getElementById('fileInput').click()">Load Setup</button>
                <button class="btn-print" onclick="window.print()">Print</button>
            </div>

            <button id="btnSound" class="btn-sound" onclick="toggleSound()">Sound: ON</button>
            
            <input type="file" id="fileInput" accept=".json" onchange="loadLayout(this)">
        </div>
    </div>

    <script>
        const container = document.getElementById('court-container');
        let zIndexCounter = 100;
        let globalWorkbook = null; // Stores the spreadsheet data globally

        function toggleMenu() {
            const controls = document.getElementById('controls');
            const showBtn = document.getElementById('show-menu-btn');
            controls.style.display = controls.style.display === 'none' ? 'flex' : 'none';
            showBtn.style.display = controls.style.display === 'none' ? 'block' : 'none';
        }

        // --- Multi-Tab Google Sheets / Excel Logic ---
        
        // 1. Fetch from pasted link
        async function fetchGoogleSheet() {
            const urlInput = document.getElementById('sheetUrlInput').value.trim();
            if (!urlInput) { alert("Please paste a Google Sheets URL."); return; }

            const fetchBtn = document.getElementById('fetchBtn');
            fetchBtn.innerText = "Loading...";

            try {
                // Convert Google Sheet link to an Excel download link
                let exportUrl = urlInput;
                if (exportUrl.includes('/pubhtml') || exportUrl.includes('/pub')) {
                    exportUrl = exportUrl.split('?')[0] + '?output=xlsx';
                } else if (exportUrl.includes('/edit')) {
                    exportUrl = exportUrl.replace(/\/edit.*/, '/export?format=xlsx');
                }

                // Use a proxy to bypass school network CORS blocks
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(exportUrl);
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network error fetching sheet.");
                
                const arrayBuffer = await response.arrayBuffer();
                
                // Read the workbook using SheetJS
                globalWorkbook = XLSX.read(arrayBuffer, { type: 'array' });
                populateDropdown();
                
            } catch (error) {
                console.error(error);
                alert("Could not fetch link directly (likely blocked by network firewall). Please download the sheet as an Excel file (.xlsx) and use the 'Upload .xlsx' button instead.");
            } finally {
                fetchBtn.innerText = "Fetch Link";
            }
        }

        // 2. Failsafe: Handle manual Excel file upload
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                globalWorkbook = XLSX.read(data, { type: 'array' });
                populateDropdown();
            };
            reader.readAsArrayBuffer(file);
            event.target.value = ''; // Reset input
        }

        // 3. Populate dropdown with tabs
        function populateDropdown() {
            if (!globalWorkbook) return;
            const select = document.getElementById('classSelect');
            select.innerHTML = ''; // Clear old tabs
            
            globalWorkbook.SheetNames.forEach(sheetName => {
                const opt = document.createElement('option');
                opt.value = sheetName;
                opt.innerText = sheetName;
                select.appendChild(opt);
            });

            select.style.display = 'block';
            
            // Automatically render the first tab
            if (globalWorkbook.SheetNames.length > 0) {
                renderSelectedClass();
            }
        }

        // 4. Render the seats based on selected tab
        function renderSelectedClass() {
            if (!globalWorkbook) return;
            const sheetName = document.getElementById('classSelect').value;
            const worksheet = globalWorkbook.Sheets[sheetName];
            
            // Convert tab data to JSON array
            const students = XLSX.utils.sheet_to_json(worksheet);
            
            // Clear existing seats before placing new ones
            document.querySelectorAll('.seat').forEach(s => s.remove());

            const startX = 100, startY = 100, spacingX = 90, spacingY = 110;
            const cols = Math.floor((window.innerWidth - 280) / spacingX);

            students.forEach((student, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);
                const x = startX + (col * spacingX);
                const y = startY + (row * spacingY);

                // Check common headers for Name and Image
                const name = student.StudentName || student.Name || student.student || Object.values(student)[0] || "Unknown";
                const imgUrl = student.ImageURL || student.Image || student.Photo || null;
                
                createSeatElement(x, y, name, imgUrl);
            });
            playSound('pickup');
        }

        // --- Core Seat Logic ---
        function createSeatElement(x, y, name = "", imgUrl = null) {
            const seat = document.createElement('div');
            seat.className = 'seat';
            
            seat.style.left = (x !== undefined ? x : window.innerWidth / 2 - 40) + 'px';
            seat.style.top = (y !== undefined ? y : window.innerHeight / 2 - 50) + 'px';
            
            if (imgUrl && imgUrl.trim() !== "") {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = 'student-img';
                img.draggable = false;
                img.onerror = function() { this.style.display = 'none'; };
                seat.appendChild(img);
            }

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'name-input';
            input.value = name || 'Student';
            
            seat.appendChild(input);
            container.appendChild(seat);
            makeDraggable(seat);
            
            seat.addEventListener('dblclick', function() {
                if(confirm('Remove this student?')) seat.remove();
            });
            return seat;
        }

        function addSeat() {
            createSeatElement();
            playSound('pickup');
        }

        // --- Saving and Loading ---
        function saveLayout() {
            const seats = document.querySelectorAll('.seat');
            const data = [];
            seats.forEach(seat => {
                const name = seat.querySelector('.name-input').value;
                const imgEl = seat.querySelector('.student-img');
                data.push({ left: seat.style.left, top: seat.style.top, name: name, imgUrl: imgEl ? imgEl.src : null });
            });
            const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            const className = document.getElementById('classSelect').value || "gym_class";
            a.download = `${className}_layout.json`;
            a.click();
        }

        function loadLayout(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {

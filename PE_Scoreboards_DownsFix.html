/* ---------- Shared class library: Soccer's saved classes ("soccerAppProfiles") are the master list ---------- */
function peFactory(){
  const P='soccerAppProfiles', X='pe_extras';
  // Small in-memory cache so repeated reads in the same tick (e.g. names()+get() back to back) don't
  // each re-parse localStorage; invalidated on our own writes and whenever another tab/iframe writes these keys.
  const cache={};
  const rd=k=>{
    if(k in cache) return cache[k];
    let v; try{v=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){v={}}
    cache[k]=v; return v;
  };
  const wr=(k,v)=>{localStorage.setItem(k,JSON.stringify(v)); cache[k]=v;};
  addEventListener('storage',e=>{ if(e.key===P||e.key===X) delete cache[e.key]; });
  const nk=s=>String(s==null?'':s).trim().toLowerCase();
  const mk=(n,g,s)=>({id:Date.now()+Math.random(),name:n,gender:g||'U',skill:s||3,shiftCount:0,goals:0,hasPlayed:false,isBenched:false,isPenalized:false,penaltyTimeRemaining:0,isOut:false,outTime:0,isNurse:false,nurseTime:0,isEjected:false,isAggressive:false,isAbsent:false,notes:''});
  const api={
    names:()=>Object.keys(rd(P)),
    get(cls,sport){
      const p=rd(P)[cls]; if(!p) return null;
      const ex=(rd(X)[cls]||{})[sport]||{};
      const out=(p.allPlayers||[]).map(pl=>({name:pl.name,gender:pl.gender,skill:pl.skill,extra:ex[nk(pl.name)]||null}));
      out.meta=ex.__meta||null; return out;
    },
    // list=[{name,gender,skill,extra}]; extra/meta hold sport-specific data Soccer doesn't know about
    put(cls,sport,list,meta,extrasOnly){
      const ps=rd(P); let p=ps[cls];
      if(!extrasOnly){
        const isNew=!p; if(isNew) p=ps[cls]={allPlayers:[],currentTeams:[],blockedPairs:'',numTeams:2,className:cls};
        const old=new Map((p.allPlayers||[]).map(x=>[nk(x.name),x]));
        let changed=isNew||old.size!==list.length;
        p.allPlayers=list.map(it=>{
          const o=old.get(nk(it.name));
          if(!o){changed=true;return mk(it.name,it.gender,it.skill)}
          if(o.skill!==it.skill||(it.gender&&o.gender!==it.gender)) changed=true;
          return {...o,gender:it.gender||o.gender,skill:it.skill};
        });
        if(changed) p.currentTeams=[];   // saved team split would be stale
        wr(P,ps);
      }
      const xs=rd(X), ex={}; list.forEach(it=>{if(it.extra) ex[nk(it.name)]=it.extra}); if(meta) ex.__meta=meta;
      (xs[cls]=xs[cls]||{})[sport]=ex; wr(X,xs);
    },
    del(cls){const ps=rd(P),xs=rd(X); delete ps[cls]; delete xs[cls]; wr(P,ps); wr(X,xs)},
    // Conflict pairs ("keep these two apart") are a property of the CLASS, not any one sport, so they live
    // on the shared master record and every sport reads/writes the same value for a given class.
    getBlocked(cls){const p=rd(P)[cls]; return p?(p.blockedPairs||''):''},
    putBlocked(cls,val){const ps=rd(P); if(ps[cls]){ps[cls].blockedPairs=val; wr(P,ps)}},
    // One-time import of classes each sport saved on its own before sharing existed (originals are left untouched)
    migrate(){
      if(localStorage.getItem('pe_migrated_v1')) return;
      const add=(cls,sport,list,meta)=>{try{api.put(cls,sport,list,meta,!!rd(P)[cls])}catch(e){}};
      const L=a=>(a||[]).filter(x=>x&&x.name).map(x=>({name:x.name,gender:x.gender,skill:x.skill,extra:x}));
      const N=L2=>L2.map(x=>({...x,extra:null}));
      const keys=Array.from({length:localStorage.length},(_,i)=>localStorage.key(i));
      keys.forEach(k=>{try{
        if(k.startsWith('wiffle_profile_')&&!k.startsWith('wiffle_profile_AutoBackup')) add(k.slice(15),'wiffle',L(Object.values(JSON.parse(localStorage.getItem(k)))));
        else if(k.startsWith('FB_Profile_')){const d=JSON.parse(localStorage.getItem(k)); add(k.slice(11),'football',N(L(d.allPlayers))); if(d.blockedPairs) api.putBlocked(k.slice(11),d.blockedPairs)}
      }catch(e){}});
      try{const sc=rd('vb_state').savedClasses||{}; Object.keys(sc).forEach(c=>add(c,'volleyball',N(L(sc[c]))))}catch(e){}
      try{const db=rd('savedClassesDatabase'); Object.keys(db).forEach(c=>add(c,'hoop',L(db[c])))}catch(e){}
      localStorage.setItem('pe_migrated_v1','1');
    }
  };
  return api;
}

/* Runs inside each sport's frame, before that sport's own code */
function peInit(cfg){
  window.__SEARCH=cfg.search;
  window.__popupUrl=q=>cfg.base+'?sport='+cfg.sport+'&'+q;
  const PE=peFactory(), s=cfg.sport, rid=()=>Math.random().toString(36).slice(2,11);
  const dropdown={soccer:['profile-select','loadProfilesDropdown'],volleyball:['class-select','updateClassDropdown'],wiffle:['profile-dropdown','updateProfileDropdown'],football:['profile-select','updateProfileDropdown'],hoop:['class-select','updateClassDropdown'],teammaker:['tm-class-select','refreshClassDropdown']}[s];
  // Generic shared-class API: any sport can list/get/put/delete classes without needing its own adapter (used by Team Maker)
  window.__PE_CLASSES={
    names:()=>PE.names(),
    get:(cls)=>(PE.get(cls,s)||[]).map(x=>({name:x.name,gender:x.gender,skill:x.skill})),
    put:(cls,list)=>PE.put(cls,s,list),
    del:(cls)=>PE.del(cls),
    // Conflict pairs: one shared value per class, visible/editable from every sport
    getBlockedPairs:(cls)=>PE.getBlocked(cls),
    setBlockedPairs:(cls,val)=>PE.putBlocked(cls,val)
  };
  // when another sport adds/edits/deletes a class (or its conflict pairs), refresh this sport's own view, keeping the current selection
  addEventListener('storage',e=>{ if(e.key!=='soccerAppProfiles') return;
    try{const el=document.getElementById(dropdown[0]), v=el&&el.value; window[dropdown[1]]&&window[dropdown[1]](); if(el&&v) el.value=v}catch(x){}
    try{ window.__refreshBlockedPairs && window.__refreshBlockedPairs(); }catch(x){} });

  const collection=(sport,toApp,fromApp)=>new Proxy({},{
    get:(t,k)=>{if(typeof k!=='string')return; const g=PE.get(k,sport); return g&&g.map(toApp)},
    set:(t,k,v)=>{PE.put(k,sport,v.map(fromApp)); return true},
    deleteProperty:(t,k)=>{PE.del(k); return true},
    ownKeys:()=>PE.names(), has:(t,k)=>PE.names().includes(k),
    getOwnPropertyDescriptor:(t,k)=>PE.names().includes(k)?{value:undefined,enumerable:true,configurable:true,writable:true}:undefined
  });
  const facade=(pref,sport,toStr,fromStr,skip)=>({
    _v:k=>k.startsWith(pref)&&!(skip&&k.startsWith(skip)),
    getItem(k){if(!this._v(k))return localStorage.getItem(k); const c=k.slice(pref.length); const g=PE.get(c,sport); return g?toStr(g,c):null},
    setItem(k,v){if(!this._v(k))return localStorage.setItem(k,v); fromStr(k.slice(pref.length),v)},
    removeItem(k){this._v(k)?PE.del(k.slice(pref.length)):localStorage.removeItem(k)},
    _keys(){const r=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(!this._v(k)) r.push(k)} return r.concat(PE.names().map(n=>pref+n))},
    get length(){return this._keys().length}, key(i){const k=this._keys()[i]; return k===undefined?null:k}
  });

  if(s==='hoop') window.__HOOP_DB=collection('hoop',
    l=>({...(l.extra||{}),id:(l.extra&&l.extra.id)||'p_'+rid(),name:l.name,gender:l.gender||'',skill:l.skill,tags:0,isEliminated:false,isAbsent:!!(l.extra&&l.extra.isAbsent)}),
    p=>({name:p.name,gender:p.gender,skill:p.skill,extra:p}));
  if(s==='volleyball') window.__VB_SC=collection('volleyball',
    l=>({id:rid(),name:l.name,gender:l.gender||'M',skill:l.skill,absent:false,outOnPass:false,stats:{good:0,bad:0}}),
    p=>({name:p.name,gender:p.gender,skill:p.skill}));
  if(s==='wiffle') window.__LS=facade('wiffle_profile_','wiffle',
    g=>{const o={}; g.forEach(l=>{const x=l.extra||{},pid=x.id||rid();
      o[pid]={atBats:0,hits:0,bb:0,runs:0,rbi:0,hustle:0,defense:0,notes:'',absent:false,risk:false,state:'active',stateTimer:0,gameStats:{atBats:0,hits:0,bb:0,runs:0,rbi:0,hustle:0,defense:0},...x,id:pid,name:l.name,gender:l.gender||'M',skill:l.skill||3}});
      return JSON.stringify(o)},
    (c,v)=>PE.put(c,'wiffle',Object.values(JSON.parse(v)).map(p=>({name:p.name,gender:p.gender,skill:p.skill,extra:p}))),
    'wiffle_profile_AutoBackup');
  if(s==='football') window.__LS=facade('FB_Profile_','football',
    (g,c)=>JSON.stringify({allPlayers:g.map((l,i)=>({id:Date.now()+i,name:l.name,gender:String(l.gender||'U').charAt(0).toUpperCase(),skill:l.skill,isBenched:false,isAbsent:false,shiftCount:0,penaltyTime:0,penaltyCount:0,notes:''})),
      rawInput:g.map(l=>l.name+', '+(l.gender||'U')+', '+l.skill).join('\n'),blockedPairs:PE.getBlocked(c)}),
    (c,v)=>{const d=JSON.parse(v); PE.put(c,'football',(d.allPlayers||[]).map(p=>({name:p.name,gender:p.gender,skill:p.skill}))); if(d.blockedPairs!==undefined) PE.putBlocked(c,d.blockedPairs);});
}

function decode(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))); }

function load(app, search){
  const shim = '<script>const peFactory=' + peFactory.toString() + ';(' + peInit.toString() + ')(' +
    JSON.stringify({sport: app.key, search, base}) + ');<\/script>';
  let html = decode(app.b64);
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + shim) : shim + html;
  const f = document.createElement('iframe');
  f.dataset.key = app.key;
  f.title = app.label;
  f.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write');
  f.setAttribute('allowfullscreen', '');
  f.srcdoc = html;
  frames.appendChild(f);
  loaded[app.key] = f;
  return f;
}

function show(key){
  const app = APPS.find(a => a.key === key) || APPS[0];
  if (!loaded[app.key]) load(app, '');
  Object.values(loaded).forEach(f => f.classList.toggle('active', f.dataset.key === app.key));
  bar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.key === app.key));
  try { localStorage.setItem('pe_combined_last_tab', app.key); } catch(e){}
  document.title = app.label + ' – PE Scoreboards';
}

if (soloKey && APPS.some(a => a.key === soloKey)) {
  // Projector / display window: show only that sport, hand it the original query string
  document.body.classList.add('solo');
  params.delete('sport');
  const app = APPS.find(a => a.key === soloKey);
  const f = load(app, params.toString() ? '?' + params.toString() : '');
  f.classList.add('active');
} else {
  APPS.forEach(a => {
    const b = document.createElement('button');
    b.dataset.key = a.key; b.textContent = a.icon + ' ' + a.label;
    b.onclick = () => show(a.key);
    bar.appendChild(b);
  });
  let last = null;
  try { last = localStorage.getItem('pe_combined_last_tab'); } catch(e){}
  show(location.hash.slice(1) || last || APPS[0].key);
}
</script>
</body>
</html>

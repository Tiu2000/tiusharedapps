<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PE Scoreboards</title>
<style>
  :root { --bar-h: 48px; --bg:#0f172a; --tab:#1e293b; --tab-hover:#334155; --accent:#3b82f6; --text:#e2e8f0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#fff; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; overflow:hidden; }
  #tabbar { position:fixed; top:0; left:0; right:0; height:var(--bar-h); background:var(--bg); display:flex; align-items:stretch; gap:4px; padding:6px 8px 0; overflow-x:auto; z-index:10; }
  #tabbar button.tab-btn { flex:0 0 auto; border:0; background:var(--tab); color:var(--text); font-weight:600; font-size:15px; font-family:inherit; padding:0 16px; border-radius:8px 8px 0 0; cursor:pointer; white-space:nowrap; }
  #tabbar button.tab-btn:hover { background:var(--tab-hover); }
  #tabbar button.tab-btn.active { background:#fff; color:#0f172a; box-shadow:inset 0 3px 0 var(--accent); }
  #bar-utils { margin-left:auto; display:flex; align-items:center; gap:6px; padding-bottom:6px; padding-left:10px; flex:0 0 auto; }
  .util-btn { border:1px solid #334155; background:#1e293b; color:#cbd5e1; font-size:12px; font-weight:600; padding:4px 10px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .util-btn:hover { background:#334155; color:#fff; }
  #frames { position:fixed; top:var(--bar-h); left:0; right:0; bottom:0; }
  body.solo { --bar-h: 0px; }
  body.solo #tabbar { display:none; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  iframe.active { display:block; }
  #tiu-watermark { position:fixed; bottom:6px; right:10px; font:700 11px/1 sans-serif; letter-spacing:2px; color:#64748b; opacity:0.28; pointer-events:none; z-index:9999; user-select:none; }
</style>
</head>

  </div>
</div>
<div id="frames"></div>

function exportAllPEData() {
  const dump = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k) dump[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), storage: dump }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'PE_Scoreboards_Backup_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function importAllPEData(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const store = parsed && parsed.storage ? parsed.storage : parsed;
      if (!store || typeof store !== 'object') throw new Error('Invalid backup format');
      if (!confirm('Restore all saved classes and scoreboard settings from this backup?')) return;
      Object.entries(store).forEach(([k, v]) => { if (typeof v === 'string') localStorage.setItem(k, v); });
      alert('Backup restored! Reloading scoreboards...');
      location.reload();
    } catch (err) { alert('Could not restore backup: ' + err.message); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function peFactory(){
  const P='soccerAppProfiles', X='pe_extras';
  const cache={};
  const rd=k=>{ if(k in cache) return cache[k]; let v; try{v=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){v={}} cache[k]=v; return v; };
  const wr=(k,v)=>{ try { localStorage.setItem(k,JSON.stringify(v)); cache[k]=v; } catch(e) { alert('Browser storage full! Export Backup JSON and clear unused custom audio.'); } };
  addEventListener('storage',e=>{ if(e.key===P||e.key===X) delete cache[e.key]; });
  const clean=s=>String(s==null?'':s).replace(/[\u200b-\u200d\u2060\ufeff]/g,'').replace(/\s+/g,' ').trim();
  const nk=s=>clean(s).toLowerCase();
  const mk=(n,g,s)=>({id:Date.now()+Math.random(),name:clean(n),gender:g||'U',skill:s||3,shiftCount:0,goals:0,hasPlayed:false,isBenched:false,isPenalized:false,penaltyTimeRemaining:0,isOut:false,outTime:0,isNurse:false,nurseTime:0,isEjected:false,isAggressive:false,isAbsent:false,notes:''});
  const api={
    clean, names:()=>Object.keys(rd(P)),
    get(cls,sport){ const p=rd(P)[cls]; if(!p) return null; const ex=(rd(X)[cls]||{})[sport]||{}; const out=(p.allPlayers||[]).map(pl=>({name:clean(pl.name),gender:pl.gender,skill:pl.skill,extra:ex[nk(pl.name)]||ex[String(pl.name).trim().toLowerCase()]||null})); out.meta=ex.__meta||null; return out; },
    put(cls,sport,list,meta,extrasOnly){
      const ps=rd(P); let p=ps[cls];
      if(!extrasOnly){
        const isNew=!p; if(isNew) p=ps[cls]={allPlayers:[],currentTeams:[],blockedPairs:'',numTeams:2,className:cls};
        const old=new Map((p.allPlayers||[]).map(x=>[nk(x.name),x]));
        let changed=isNew||old.size!==list.length;
        p.allPlayers=list.map(it=>{ const o=old.get(nk(it.name)); if(!o){changed=true;return mk(it.name,it.gender,it.skill)} if(o.skill!==it.skill||(it.gender&&o.gender!==it.gender)) changed=true; return {...o,name:clean(o.name),gender:it.gender||o.gender,skill:it.skill}; });
        if(changed) p.currentTeams=[];
        wr(P,ps);
      }
      const xs=rd(X), ex={}; list.forEach(it=>{if(it.extra) ex[nk(it.name)]=it.extra}); if(meta) ex.__meta=meta;
      (xs[cls]=xs[cls]||{})[sport]=ex; wr(X,xs);
    },
    del(cls){const ps=rd(P),xs=rd(X); delete ps[cls]; delete xs[cls]; wr(P,ps); wr(X,xs)},
    getBlocked(cls){const p=rd(P)[cls]; return p?(p.blockedPairs||''):''},
    putBlocked(cls,val){const ps=rd(P); if(ps[cls]){ps[cls].blockedPairs=val; wr(P,ps)}},
    migrate(){
      if(localStorage.getItem('pe_migrated_v1')) return;
      const add=(cls,sport,list,meta)=>{try{api.put(cls,sport,list,meta,!!rd(P)[cls])}catch(e){}};
      const L=a=>(a||[]).filter(x=>x&&x.name).map(x=>({name:x.name,gender:x.gender,skill:x.skill,extra:x}));
      const N=L2=>L2.map(x=>({...x,extra:null}));
      const keys=Array.from({length:localStorage.length},(_,i)=>localStorage.key(i));
      keys.forEach(k=>{try{
        if(k.startsWith('wiffle_profile_')&&!k.startsWith('wiffle_profile_AutoBackup')) add(k.slice(15),'wiffle',L(Object.values(JSON.parse(localStorage.getItem(k)))));
        else if(k.startsWith('FB_Profile_')){const d=JSON.parse(localStorage.getItem(k)); add(k.slice(11),'football',N(L(d.allPlayers))); if(d.blockedPairs) api.putBlocked(k.slice(11),d.blockedPairs)}
      }catch(e){}});
      try{const sc=rd('vb_state').savedClasses||{}; Object.keys(sc).forEach(c=>add(c,'volleyball',N(L(sc[c]))))}catch(e){}
      try{const db=rd('savedClassesDatabase'); Object.keys(db).forEach(c=>add(c,'hoop',L(db[c])))}catch(e){}
      localStorage.setItem('pe_migrated_v1','1');
    }
  };
  return api;
}

function peInit(cfg){
  window.__SEARCH=cfg.search;
  window.__popupUrl=q=>cfg.base+'?sport='+cfg.sport+'&'+q;
  const PE=peFactory(); window.cleanName=PE.clean; const s=cfg.sport, rid=()=>Math.random().toString(36).slice(2,11);
  window.peNotice=function(msg){
    let el=document.getElementById('pe-notice');
    if(!el){ el=document.createElement('div'); el.id='pe-notice'; el.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;font:600 14px sans-serif;z-index:2147483647;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:opacity .3s;pointer-events:none;'; document.body.appendChild(el); }
    el.textContent=msg; el.style.opacity='1'; clearTimeout(el._t); el._t=setTimeout(()=>{el.style.opacity='0'},2600);
  };
  window.closeProjector=function(){
    let closed=false, answered=false;
    try{ const w=window.__projWin; if(w && !w.closed){ w.close(); closed=true; } }catch(e){}
    window.__projWin=null;
    try{
      const ch=new BroadcastChannel('pe-projector-ctl');
      ch.onmessage=e=>{ if(e.data && e.data.type==='closed' && e.data.sport===s) answered=true; };
      ch.postMessage({type:'close',sport:s});
      setTimeout(()=>{ ch.close(); peNotice((closed||answered)?'✅ Projector screen closed':'No open projector screen found for this scoreboard'); },350);
    }catch(e){ peNotice(closed?'✅ Projector screen closed':'No open projector screen found for this scoreboard'); }
  };
  const dropdown={soccer:['profile-select','loadProfilesDropdown'],volleyball:['class-select','updateClassDropdown'],wiffle:['profile-dropdown','updateProfileDropdown'],football:['profile-select','updateProfileDropdown'],hoop:['class-select','updateClassDropdown'],teammaker:['tm-class-select','refreshClassDropdown']}[s];
  window.__PE_CLASSES={
    names:()=>PE.names(), get:(cls)=>(PE.get(cls,s)||[]).map(x=>({name:x.name,gender:x.gender,skill:x.skill})),
    put:(cls,list)=>PE.put(cls,s,list), del:(cls)=>PE.del(cls),
    getBlockedPairs:(cls)=>PE.getBlocked(cls), setBlockedPairs:(cls,val)=>PE.putBlocked(cls,val)
  };
  addEventListener('storage',e=>{ if(e.key!=='soccerAppProfiles') return;
    try{const el=document.getElementById(dropdown[0]), v=el&&el.value; window[dropdown[1]]&&window[dropdown[1]](); if(el&&v) el.value=v}catch(x){}
    try{ window.__refreshBlockedPairs && window.__refreshBlockedPairs(); }catch(x){} });
  const collection=(sport,toApp,fromApp)=>new Proxy({},{
    get:(t,k)=>{if(typeof k!=='string')return; const g=PE.get(k,sport); return g&&g.map(toApp)},
    set:(t,k,v)=>{PE.put(k,sport,v.map(fromApp)); return true},
    deleteProperty:(t,k)=>{PE.del(k); return true},
    ownKeys:()=>PE.names(), has:(t,k)=>PE.names().includes(k),
    getOwnPropertyDescriptor:(t,k)=>PE.names().includes(k)?{value:undefined,enumerable:true,configurable:true,writable:true}:undefined
  });
  const facade=(pref,sport,toStr,fromStr,skip)=>({
    _v:k=>k.startsWith(pref)&&!(skip&&k.startsWith(skip)),
    getItem(k){if(!this._v(k))return localStorage.getItem(k); const c=k.slice(pref.length); const g=PE.get(c,sport); return g?toStr(g,c):null},
    setItem(k,v){if(!this._v(k))return localStorage.setItem(k,v); fromStr(k.slice(pref.length),v)},
    removeItem(k){this._v(k)?PE.del(k.slice(pref.length)):localStorage.removeItem(k)},
    _keys(){const r=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(!this._v(k)) r.push(k)} return r.concat(PE.names().map(n=>pref+n))},
    get length(){return this._keys().length}, key(i){const k=this._keys()[i]; return k===undefined?null:k}
  });
  if(s==='hoop') window.__HOOP_DB=collection('hoop',l=>({...(l.extra||{}),id:(l.extra&&l.extra.id)||'p_'+rid(),name:l.name,gender:l.gender||'',skill:l.skill,tags:0,isEliminated:false,isAbsent:!!(l.extra&&l.extra.isAbsent)}),p=>({name:p.name,gender:p.gender,skill:p.skill,extra:p}));
  if(s==='volleyball') window.__VB_SC=collection('volleyball',l=>({id:rid(),name:l.name,gender:l.gender||'M',skill:l.skill,absent:false,outOnPass:false,stats:{good:0,bad:0}}),p=>({name:p.name,gender:p.gender,skill:p.skill}));
  if(s==='wiffle') window.__LS=facade('wiffle_profile_','wiffle',g=>{const o={}; g.forEach(l=>{const x=l.extra||{},pid=x.id||rid(); o[pid]={atBats:0,hits:0,bb:0,runs:0,rbi:0,hustle:0,defense:0,notes:'',absent:false,risk:false,state:'active',stateTimer:0,gameStats:{atBats:0,hits:0,bb:0,runs:0,rbi:0,hustle:0,defense:0},...x,id:pid,name:l.name,gender:l.gender||'M',skill:l.skill||3}}); return JSON.stringify(o)},(c,v)=>PE.put(c,'wiffle',Object.values(JSON.parse(v)).map(p=>({name:p.name,gender:p.gender,skill:p.skill,extra:p}))),'wiffle_profile_AutoBackup');
  if(s==='football') window.__LS=facade('FB_Profile_','football',(g,c)=>JSON.stringify({allPlayers:g.map((l,i)=>({id:Date.now()+i,name:l.name,gender:String(l.gender||'U').charAt(0).toUpperCase(),skill:l.skill,isBenched:false,isAbsent:false,shiftCount:0,penaltyTime:0,penaltyCount:0,notes:''})),rawInput:g.map(l=>l.name+', '+(l.gender||'U')+', '+l.skill).join('\n'),blockedPairs:PE.getBlocked(c)}),(c,v)=>{const d=JSON.parse(v); PE.put(c,'football',(d.allPlayers||[]).map(p=>({name:p.name,gender:p.gender,skill:p.skill}))); if(d.blockedPairs!==undefined) PE.putBlocked(c,d.blockedPairs);});
}

function decode(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))); }

function focusActiveScoreboard(f) {
  if (!f) return;
  f.setAttribute('tabindex', '-1');
  requestAnimationFrame(() => { try { f.focus(); f.contentWindow && f.contentWindow.focus(); } catch(e) {} });
}

function load(app, search){
  const shim = '<script>const peFactory=' + peFactory.toString() + ';(' + peInit.toString() + ')(' + JSON.stringify({sport: app.key, search, base}) + ');<\/script>';
  let html = decode(app.b64);
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + shim) : shim + html;
  const f = document.createElement('iframe');
  f.dataset.key = app.key; f.title = app.label;
  f.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write');
  f.setAttribute('allowfullscreen', '');
  f.onload = () => {
    try {
      f.contentWindow.addEventListener('keydown', (e) => {
        if (e.altKey && !e.ctrlKey && !e.metaKey && e.key >= '1' && e.key <= String(APPS.length)) {
          e.preventDefault();
          show(APPS[parseInt(e.key, 10) - 1].key);
        }
      });
    } catch(e) {}
    if (f.classList.contains('active')) focusActiveScoreboard(f);
  };
  f.srcdoc = html;
  frames.appendChild(f);
  loaded[app.key] = f;
  return f;
}

function show(key){
  const app = APPS.find(a => a.key === key) || APPS[0];
  if (!loaded[app.key]) load(app, '');
  let activeFrame = null;
  Object.values(loaded).forEach(f => { const isAct = f.dataset.key === app.key; f.classList.toggle('active', isAct); if (isAct) activeFrame = f; });
  bar.querySelectorAll('button.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === app.key));
  try { localStorage.setItem('pe_combined_last_tab', app.key); } catch(e){}
  document.title = app.label + ' – PE Scoreboards';
  focusActiveScoreboard(activeFrame);
}

document.addEventListener('keydown', (e) => {
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.key >= '1' && e.key <= '9') {
    const btns = bar.querySelectorAll('button.tab-btn');
    const idx = parseInt(e.key, 10) - 1;
    if (btns[idx]) { e.preventDefault(); btns[idx].click(); }
    return;
  }
  const activeFrame = frames.querySelector('iframe.active');
  if (!activeFrame || !activeFrame.contentWindow) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  focusActiveScoreboard(activeFrame);
  activeFrame.contentWindow.document.dispatchEvent(new KeyboardEvent('keydown', {
    key: e.key, code: e.code, shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, altKey: e.altKey, metaKey: e.metaKey, bubbles: true, cancelable: true
  }));
});

if (soloKey && APPS.some(a => a.key === soloKey)) {
  document.body.classList.add('solo');
  try{ const ctl=new BroadcastChannel('pe-projector-ctl');
    ctl.onmessage=e=>{ const m=e.data; if(m && m.type==='close' && m.sport===soloKey){ ctl.postMessage({type:'closed',sport:soloKey});
      setTimeout(()=>{ window.close(); setTimeout(()=>{ document.body.innerHTML='<div style="font:600 22px sans-serif;color:#fff;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;">Projector closed from the dashboard.<br>You can close this window.</div>'; },300); },60); } };
  }catch(e){}
  params.delete('sport');
  const app = APPS.find(a => a.key === soloKey);
  const f = load(app, params.toString() ? '?' + params.toString() : '');
  f.classList.add('active');
} else {
  APPS.forEach((a, idx) => {
    const b = document.createElement('button');
    b.className = 'tab-btn'; b.dataset.key = a.key; b.title = a.label + ' (Alt+' + (idx + 1) + ')';
    b.textContent = a.icon + ' ' + a.label;
    b.onclick = () => show(a.key);
    bar.insertBefore(b, utils);
  });
  let last = null;
  try { last = localStorage.getItem('pe_combined_last_tab'); } catch(e){}
  show(location.hash.slice(1) || last || APPS[0].key);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Conflict Corner - Poster Size</title>
<style>
  @media print {
    /* Sets the print size to a standard 24x36 inch poster */
    @page { size: 24in 36in; margin: 0; } 
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  body {
    font-family: 'Arial Rounded MT Bold', 'Century Gothic', 'Helvetica', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #ffffff;
  }
  .page {
    width: 24in;
    height: 36in;
    padding: 1in;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .border {
    border: 20px solid #5bbbea;
    border-radius: 60px;
    height: 100%;
    padding: 60px 80px;
    box-sizing: border-box;
    background-color: #fafbfc;
    display: flex;
    flex-direction: column;
  }
  h1 {
    color: #f05353;
    font-size: 130pt;
    margin-top: 20px;
    margin-bottom: 60px;
    text-align: center;
    line-height: 1.1;
  }
  .step {
    font-size: 75pt;
    font-weight: bold;
    margin: 35px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .emoji {
    font-size: 110pt;
  }
  .emojis-bottom {
    font-size: 150pt;
    text-align: center;
    margin: auto 0;
    letter-spacing: 40px;
  }
  .footer {
    text-align: center;
    margin-top: auto;
    margin-bottom: 20px;
  }
  .footer-text {
    color: #f05353;
    font-size: 90pt;
    font-weight: 900;
    line-height: 1.2;
  }
</style>
</head>
<body>

<div class="page">
  <div class="border">
    <h1>The Conflict Corner</h1>
    
    <div class="step">
      <span>1.) Hands Out - Palms Up</span>
      <span class="emoji">🤲</span>
    </div>
    
    <div class="step">
      <span>2.) Explain the Problem</span>
    </div>
    
    <div class="step">
      <span>3.) Listen to Each Other</span>
      <span class="emoji">👂</span>
    </div>
    
    <div class="step">
      <span>4.) Brainstorm a Solution</span>
    </div>
    
    <div class="step">
      <span>5.) Shake Hands</span>
      <span class="emoji">🤝</span>
    </div>
    
    <div class="step">
      <span>6.) Give a Compliment</span>
      <span class="emoji">👍</span>
    </div>

    <div class="emojis-bottom">
      🙁 😐 🙂 😎
    </div>

    <div class="footer">
      <div class="footer-text">COMMUNICATE CLEARLY</div>
      <div class="footer-text">TELL THEM HOW YOU FEEL</div>
    </div>
    
  </div>
</div>

</body>
</html>

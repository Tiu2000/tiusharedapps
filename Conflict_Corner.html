<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Conflict Corner</title>
<style>
  @media print {
    @page { size: landscape; margin: 0; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  body {
    font-family: 'Arial Rounded MT Bold', 'Century Gothic', 'Helvetica', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #ffffff;
  }
  .page {
    width: 11in;
    height: 8.5in;
    padding: 0.4in;
    box-sizing: border-box;
    page-break-after: always;
    display: flex;
    flex-direction: column;
  }
  .border {
    border: 8px solid #5bbbea;
    border-radius: 25px;
    height: 100%;
    padding: 30px 40px;
    box-sizing: border-box;
    background-color: #fafbfc;
    display: flex;
    flex-direction: column;
  }
  h1 {
    color: #f05353;
    font-size: 48pt;
    margin-top: 0;
    margin-bottom: 20px;
  }
  .step {
    font-size: 32pt;
    font-weight: bold;
    margin: 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .emoji {
    font-size: 55pt;
  }
  .footer {
    text-align: center;
    margin-top: auto;
  }
  .footer-text {
    color: #f05353;
    font-size: 40pt;
    font-weight: 900;
    line-height: 1.2;
  }
  .emojis-bottom {
    font-size: 70pt;
    text-align: center;
    margin: auto 0;
    letter-spacing: 20px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="border">
    <h1>The Conflict Corner</h1>
    
    <div class="step">
      <span>1.) Hands Out - Palms Facing Up</span>
      <span class="emoji">🤲</span>
    </div>
    
    <div class="step">
      <span>2.) Explain the Problem</span>
    </div>
    
    <div class="step">
      <span>3.) Listen to Each Other</span>
      <span class="emoji">👂</span>
    </div>
  </div>
</div>

<div class="page">
  <div class="border">
    
    <div class="step">
      <span>4.) Brainstorm a Solution Together</span>
    </div>
    
    <div class="step">
      <span>5.) Shake Hands</span>
      <span class="emoji">🤝</span>
    </div>
    
    <div class="step">
      <span>6.) Give a Compliment</span>
      <span class="emoji">👍</span>
    </div>

    <div class="emojis-bottom">
      🙁 😐 🙂 😎
    </div>

    <div class="footer">
      <div class="footer-text">COMMUNICATE CLEARLY</div>
      <div class="footer-text">TELL THEM HOW YOU FEEL</div>
    </div>
    
  </div>
</div>

</body>
</html>
